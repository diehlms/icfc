<!DOCTYPE html>

      padding: 2rem;

      background: white;

      width: 100%;

      margin-bottom: 0.75rem;

      font-size: 0.95rem;
      line-height: 1.6;

      background: #065f46;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;

      border-radius: 8px;

      font-size: 0.75rem;
      color: #9ca3af;
    }
