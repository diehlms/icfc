services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      # Persist installed gems across container recreation
      - bundle:/usr/local/bundle
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: icfc
      POSTGRES_PASSWORD: root
      REDIS_URL: redis://redis:6379/1
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sleep infinity

  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: icfc
      POSTGRES_PASSWORD: root
      POSTGRES_DB: development_icfc
    ports:
      # Postgres listens on 5432 inside the container; expose it on 5433 to avoid clashing with a host Postgres
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icfc -d development_icfc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  bundle:
